pr: 1
entries:
  - category: config
    text: >-
      Added a diagnostic GLM NoPE policy that reserves CANNBot Prolog for
      metadata-classified decode batches while using native preprocessing for
      prefill and mixed batches. One-token cache-hit prefill classified as decode
      can still use Prolog; NPU correctness and performance validation remain pending.
  - category: bugfix
    text: >-
      BF16 KPool Indexers now use the original A projection and RMSNorm to recompute
      Query input during CANNBot decode instead of dequantizing the Prolog output.
      Prefill and mixed batches remain native; MXFP8 Indexer tuple inputs and
      KV-cache writes are unchanged, with NPU accuracy and performance checks pending.
